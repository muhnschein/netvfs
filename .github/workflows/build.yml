name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
# New push supersedes the PR's run in flight.
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXTEST_VERSION: 0.9.148
  NEXTEST_PROFILE: ci
jobs:
  # Docs-only PR: no scan (tools/ci/changes.sh).
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Merge commit and its base parent.
          fetch-depth: 2
      - id: diff
        run: ./tools/ci/changes.sh >>"$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  build:
    name: Analyze
    needs: changes
    # Fork PRs have no secrets (SONAR_TOKEN empty): skipped; main's analysis runs on merge.
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    # Hung step stops here, not at 6 h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ env.NEXTEST_VERSION }}-ubuntu-24.04
      - name: Install cargo-nextest
        run: ./tools/ci/cargo-tool.sh cargo-nextest "$NEXTEST_VERSION"
      - name: Build with coverage, run unit and interop tests
        # bear records compile_commands.json; gcovr writes build-coverage/coverage.xml; llvm-cov build-coverage/rust-lcov.info.
        run: |
          mkdir -p build-coverage
          bear --output build-coverage/compile_commands.json -- make COVERAGE=1 -j"$(nproc)"
          make coverage
          make COVERAGE=1 clippy-report
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: No open issues or hotspots
        if: success() || failure()  # also list the findings when the gate failed
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCOPE: ${{ github.event_name == 'pull_request' && format('pullRequest={0}', github.event.pull_request.number) || format('branch={0}', github.ref_name) }}
        run: ./tools/ci/sonar-issues.py
