name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Build and test (host)
    runs-on: ubuntu-24.04
    env:
      QMAKE_ARGS: NETVFS_WERROR=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh
      - name: Build
        run: make -j"$(nproc)"
      - name: Packaging checks (file lists, no share enumeration in the SMB plugin)
        run: make check-packaging
      - name: Unit tests
        run: make check-unit
      - name: Interop tests
        run: make check-interop

  sanitize:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh
      - name: Build and test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make SANITIZE=1 check

  mutation:
    name: Tests bite (mutation check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh
      - name: Build
        run: make -j"$(nproc)"
      - name: Mutation check
        run: ./tools/mutation-check.py --build build

  fuzz:
    name: Fuzzing (fixed budget)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              clang libclang-rt-dev qtbase5-dev pkg-config
      - name: Fuzz harnesses (60 s each, ASan + UBSan)
        run: ./tests/fuzz/run.sh build-fuzz 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-reproducers
          path: build-fuzz/fuzz/artifacts
          if-no-files-found: ignore

  ftp-curl820:
    name: FTP against libcurl 8.20
    # The Sailfish OS 5.2 target ships libcurl 8.20, the host job runs Ubuntu's
    # 8.5.0 (a distribution build that cannot reuse a CURLUSESSL_ALL FTP
    # connection). This job builds vanilla libcurl 8.20.0 and runs the FTP unit
    # tests and the FTP interop suite with it, which exercises the
    # CURLUSESSL_ALL path of explicit FTPS (plus the reply guard) and the
    # 8.20 command sequences.
    runs-on: ubuntu-24.04
    env:
      CURL_VERSION: 8.20.0
      # SHA-256 of curl-8.20.0.tar.xz as published in the curl release on GitHub
      CURL_SHA256: 63fe2dc148ba0ceae89922ef838f7e5c946272c2e78b7c59fab4b79d3ce2b896
      CURL_PREFIX: ${{ github.workspace }}/curl-prefix
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              build-essential pkg-config python3 openssl \
              qtbase5-dev qtbase5-dev-tools libaccounts-qt5-dev libsignon-qt5-dev \
              libssl-dev zlib1g-dev
      - name: Cache libcurl ${{ env.CURL_VERSION }}
        id: curl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CURL_PREFIX }}
          key: libcurl-${{ env.CURL_VERSION }}-${{ env.CURL_SHA256 }}-ubuntu-24.04
      - name: Build libcurl ${{ env.CURL_VERSION }}
        if: steps.curl-cache.outputs.cache-hit != 'true'
        run: ./tools/ci/build-curl.sh "$CURL_VERSION" "$CURL_SHA256" "$CURL_PREFIX"
      - name: FTP unit and interop tests against libcurl ${{ env.CURL_VERSION }}
        run: ./tools/ci/ftp-against-curl.sh "$CURL_PREFIX"

  rpm:
    name: Sailfish OS 5.2 aarch64 RPMs
    runs-on: ubuntu-24.04
    env:
      SDK_IMAGE: mirror.gcr.io/coderus/sailfishos-platform-sdk-aarch64:5.2.0.15@sha256:e5f7596d14502746b308c3dde36f65fc25d7f76c45a01acaed56a1f55b76f592
      TARGET: SailfishOS-5.2.0.15-aarch64
      # netvfs 0.1.0 (main after PR #1), the last release before the package
      # split: the SPEC-v2 XP-2 update check starts from its RPMs.
      UPGRADE_BASE: 599828d1ab59a981f3cbf26b310c0d25962b5b24
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - name: QML UI and plugin on the target (Qt 5.6, real Silica)
        run: ./tests/qmltarget/run-in-sdk.sh
      - name: Build RPMs in the Sailfish SDK
        run: ./tools/ci/build-rpm.sh
      - name: Check dependencies and installability on the target
        run: ./tools/ci/check-rpm.sh
      - name: Cache the ${{ env.UPGRADE_BASE }} RPMs
        id: base-rpms
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build-upgrade/base-rpms
          key: netvfs-rpms-${{ env.UPGRADE_BASE }}-${{ env.TARGET }}
      - name: Check out ${{ env.UPGRADE_BASE }}
        if: steps.base-rpms.outputs.cache-hit != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.UPGRADE_BASE }}
          path: build-upgrade/base
          submodules: recursive
      - name: Build the ${{ env.UPGRADE_BASE }} RPMs
        if: steps.base-rpms.outputs.cache-hit != 'true'
        run: |
          ./build-upgrade/base/tools/ci/build-rpm.sh
          mkdir -p build-upgrade/base-rpms
          cp build-upgrade/base/RPMS/*.rpm build-upgrade/base-rpms/
      - name: Update from 0.1.0 keeps the backups (XP-2)
        run: ./tools/ci/check-upgrade.sh build-upgrade/base-rpms RPMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netvfs-rpms-aarch64
          path: RPMS/*.rpm
          if-no-files-found: error
