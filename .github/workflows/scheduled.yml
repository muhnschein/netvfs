name: Weekly
# Advisories against locked crates, next stable clippy, online workflow audit, Rust tests under ASan and LSan, netvfs-bridge's FFI test with the C++ side instrumented too.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true
env:
  DENY_VERSION: 0.20.2
  ZIZMOR_VERSION: 1.30.1
  NEXTEST_VERSION: 0.9.148
  # -Zsanitizer needs nightly; pinned so a nightly regression is not mistaken for a finding.
  SANITIZER_NIGHTLY: nightly-2026-10-01
jobs:
  advisories:
    name: Advisories (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.DENY_VERSION }}-ubuntu-24.04
      - name: Install cargo-deny
        run: ./tools/ci/cargo-tool.sh cargo-deny "$DENY_VERSION"
      - name: Advisories against the locked crates
        working-directory: rust
        run: cargo +stable deny --locked check advisories

  next-clippy:
    name: Clippy of the current stable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          ./tools/ci/apt-install.sh --no-install-recommends pkg-config libsqlite3-dev
          rustup toolchain install stable --profile minimal --component clippy
      - name: Clippy (stable, the workspace's lints)
        working-directory: rust
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings

  zizmor-online:
    name: Workflow audit (zizmor, online)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --user "zizmor==$ZIZMOR_VERSION"
          zizmor .github/workflows

  rust-sanitizers:
    name: Rust tests under ASan + LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          ./tools/ci/install-host-deps.sh
          rustup toolchain install "$SANITIZER_NIGHTLY" --profile minimal --component rust-src
      - name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ env.NEXTEST_VERSION }}-ubuntu-24.04
      - name: Install cargo-nextest
        run: ./tools/ci/cargo-tool.sh cargo-nextest "$NEXTEST_VERSION"
      # C++ side of the FFI test with clang's ASan, whose runtime the Rust test binary links: clang of rustc's LLVM major, checked by rust-sanitize.sh.
      - name: Build the FFI's C++ libraries with ASan (the clang of rustc's LLVM)
        run: |
          major=$(rustc +"$SANITIZER_NIGHTLY" -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')
          ./tools/ci/install-clang.sh "$major"
          CLANG_MAJOR=$major ./tools/ci/ffi-libs.sh build-ffi-asan --asan
      - name: Tests under ASan + LSan
        run: ./tools/ci/rust-sanitize.sh "$SANITIZER_NIGHTLY" build-ffi-asan
