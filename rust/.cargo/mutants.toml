# cargo-mutants (tools/ci/rust-mutants.sh). Every mutant must be caught by a
# test; these are the few no test can tell from the original, each with why.
# Matched against the mutant's name with its line and column (\d+:\d+).

# Test doubles, built only with the `fake` / `testing` features and never
# shipped: the in-process FakeBridge (and its replay of the contract), the
# loader of the fake control table, and the bridge fixture with its fake
# accounts, prompt, discovery and launcher. They are the tests' oracle; a
# mutant in them says nothing about the bridge.
exclude_globs = [
    "netvfs-bridge-proto/src/fake/**",
    "netvfs-bridge/src/ffi/fake.rs",
    "netvfs-bridge/src/testing.rs",
]

exclude_re = [
    # Diagnostics only: the sole effect is a line on stderr for whoever runs
    # it by hand; the probe's result is its exit status and check count.
    'netvfs-accounts/src/bin/probe\.rs:.*: replace report with \(\)$',
    # Diagnostics only: the sole effect is a line on stderr when the kernel
    # refuses Landlock or seccomp, which no test can make it do.
    'netvfs-accounts/src/sandbox\.rs:.*: replace warn with \(\)$',
    # Equivalent: SECCOMP_RET_ERRNO and the 16 data bits are disjoint, so
    # `^` is `|` for every errno.
    'netvfs-accounts/src/sandbox\.rs:.*: replace \| with \^ in errno_action$',
    # Equivalent: O_CREAT and __O_TMPFILE (O_TMPFILE without O_DIRECTORY)
    # are disjoint bits, so `^` is `|`.
    'netvfs-accounts/src/sandbox\.rs:.*: replace \| with \^ in Filter::deny_created_mode_bits$',
    # Equivalent: a constant (no function) that combines distinct Landlock
    # access bits, e.g. landlock::NULL_DEVICE, where `^` is `|`.
    'netvfs-accounts/src/sandbox\.rs:\d+:\d+: replace \| with \^$',
    # Equivalent where the tests run: only Sailfish OS has a user
    # `privileged`; elsewhere the lookup is None anyway. The lookup itself
    # (user_ids) is tested with root and a missing user.
    'netvfs-accounts/src/sandbox\.rs:.*: replace privileged_ids -> Option<\(u32, u32\)> with None$',
    # RTLD_LOCAL is 0 on Linux: `RTLD_NOW | RTLD_LOCAL` and
    # `RTLD_NOW ^ RTLD_LOCAL` are the same flags.
    'ffi/loader\.rs:\d+:\d+: replace \| with \^ in entry_point',
    # A hint without a result; the fake backend's readAhead ignores it, as
    # backends may.
    'ffi/conn\.rs:\d+:\d+: replace Handle::read_ahead with \(\)',
    # Whether a multicast socket opens depends on the host (sandboxes and
    # some runners have none), so the test cannot require `true`.
    'ffi/discovery\.rs:\d+:\d+: replace Discovery::set_running -> bool with false',
    # The hook runs only on a report from a server on the network, which a
    # test cannot provide; Ctx::take_panic itself is unit-tested
    # (callback.rs).
    'ffi/discovery\.rs:\d+:\d+: replace Discovery::take_panic -> Option<String> with None',
    # netvfs-bridge peer.rs COMPARE_CHUNK_BYTES (64 * 1024 -> 64 + 1024): the
    # chunk size of the executable comparison only bounds memory; any size
    # gives the same verdict.
    'netvfs-bridge/src/peer\.rs:\d+:\d+: replace \* with \+$',
    # netvfs-bridge peer.rs check_process, the device half of the
    # same-inode fast path (dev == -> !=): a file that is the registered
    # executable falls through to the content comparison, which accepts it
    # too; only the cost differs.
    'netvfs-bridge/src/peer\.rs:\d+:27: replace == with != in PeerChecker::check_process$',
    # netvfs-bridge peer.rs read_fully, retry on EINTR: reads of regular
    # files and /proc are not interrupted on Linux; the retry is defensive.
    'netvfs-bridge/src/peer\.rs:\d+:\d+: replace match guard e\.kind\(\) == io::ErrorKind::Interrupted with false in read_fully$',
    # netvfs-bridge listener.rs unescape (high << 4 | low -> ^): the two
    # operands have no bit in common, so | and ^ are the same.
    'netvfs-bridge/src/server/listener\.rs:\d+:\d+: replace \| with \^ in unescape$',
    # netvfs-bridge listener.rs serve, the transient-error guard: telling
    # transient from lasting accept errors needs descriptor exhaustion
    # (EMFILE) or a listening socket that fails for good, neither of which a
    # test can produce (shutdown(2) does not make AF_UNIX accept fail).
    # is_transient itself is tested.
    'netvfs-bridge/src/server/listener\.rs:\d+:\d+: replace match guard is_transient\(&e\) with (true|false) in Listener::serve$',
    # netvfs-bridge sys/peer.rs effective_uid -> 0: the tests run as root
    # (CI containers), where the mutant returns the right value; as any
    # other user credentials_of_a_socketpair_are_ours and clock_and_uid
    # catch it.
    'netvfs-bridge/src/sys/peer\.rs:\d+:\d+: replace effective_uid -> u32 with 0$',
    # netvfs-bridge sys/peer.rs clock_ticks_per_second (hz > 0 -> >= 0):
    # sysconf(_SC_CLK_TCK) is never 0 on Linux; the guard only turns -1
    # (error) into None.
    'netvfs-bridge/src/sys/peer\.rs:\d+:\d+: replace > with >= in clock_ticks_per_second$',
    # netvfs-bridge jobs/fdio.rs, the `n > 0` guards after write(2) to a
    # FIFO and pwrite(2) to a regular file (-> true, -> >=): neither
    # returns 0 for a non-empty buffer, so 0 never reaches the guard.
    'netvfs-bridge/src/jobs/fdio\.rs:\d+:\d+: replace match guard n > 0 with true in (FdDevice<.a>::write_fifo|<impl WriteAt for FdDevice<._>>::write_at)$',
    'netvfs-bridge/src/jobs/fdio\.rs:\d+:\d+: replace > with >= in (FdDevice<.a>::write_fifo|<impl WriteAt for FdDevice<._>>::write_at)$',
    # netvfs-bridge jobs/fdio.rs write_at, a pwrite failing after an earlier
    # one of the same call (written > 0 -> false): the call loops only for
    # more than 2 GiB (MAX_CHUNK), which a test cannot write.
    'netvfs-bridge/src/jobs/fdio\.rs:\d+:\d+: replace match guard written > 0 with false in <impl WriteAt for FdDevice<._>>::write_at$',
    # netvfs-bridge locations/connector.rs establish_ad_hoc (declined &&
    # Unknown -> ||): a declined identity always ends in
    # ServerIdentityUnknown, and that failure comes only after a decline
    # (an accepted one passes, a canceled ask ends Canceled).
    'netvfs-bridge/src/locations/connector\.rs:\d+:\d+: replace && with \|\| in Connector::establish_ad_hoc$',
    # netvfs-bridge locations/connector.rs Connector::reset_cancel -> ():
    # defensive, as conn_reset_cancel after every item in C++; a worker
    # cancels a connection only for an item whose flag is set, and such an
    # item always drops the connection, so no canceled one is reused.
    'netvfs-bridge/src/locations/connector\.rs:\d+:\d+: replace <impl Backend for Connector>::reset_cancel with \(\)$',
    # netvfs-bridge locations/pool.rs retire (index < len -> <=): every
    # caller passes the index of a connection it just found.
    'netvfs-bridge/src/locations/pool\.rs:\d+:\d+: replace < with <= in Pool<B>::retire$',
    # netvfs-bridge locations/pool.rs reap_pool (released > 0 -> >=):
    # releasing 0 slots changes nothing, and resubmitting waiting work when
    # no slot came free queues it again in the same order.
    'netvfs-bridge/src/locations/pool\.rs:\d+:\d+: replace > with >= in PoolSet<B>::reap_pool$',
    # netvfs-bridge sys/fd.rs, the EINTR arms of retry and poll: no test
    # can make read/write/pread/pwrite or poll fail with EINTR (the bridge
    # installs no signal handlers), and poll of one live pollfd has no
    # other error a test can cause (a closed descriptor is POLLNVAL in
    # revents, not an error).
    'netvfs-bridge/src/sys/fd\.rs:\d+:\d+: replace match guard e\.kind\(\) == io::ErrorKind::Interrupted with (false in retry|(true|false) in poll)$',
    'netvfs-bridge/src/sys/fd\.rs:\d+:\d+: replace == with != in poll$',
    # Equivalent: an empty name is no error name, and from_bare returns None
    # for it, so the `_` arm below gives the same Protocol error as this arm.
    'netvfs-bridge-proto/src/errors\.rs:\d+:\d+: delete match arm "" in BridgeError::from_method_error$',
    # netvfs-bridge consent.rs: the inotify masks are ORs of distinct
    # single-bit flags, where `|` and `^` give the same value.
    'netvfs-bridge/src/consent\.rs:\d+:\d+: replace \| with \^',
    # netvfs-bridge sys/lock.rs: LOCK_EX | LOCK_NB, distinct bits as well.
    'netvfs-bridge/src/sys/lock\.rs:\d+:\d+: replace \| with \^',
    # netvfs-bridge core/nearby.rs FfiNearby::set_running, the warning when
    # post refuses: only a log line, and post refuses only once the Qt
    # application quits, which ends the test harness's loop as well.
    'netvfs-bridge/src/core/nearby\.rs:\d+:\d+: delete ! in <impl NearbySource for FfiNearby>::set_running$',
    # netvfs-bridge core/mod.rs, the services of the installed bridge
    # (Deps::system): they need a session bus that sends AccountsChanged,
    # which the tests do not have (the process test runs without one, as
    # session_bus -> None does); the fixture injects its own services.
    'netvfs-bridge/src/core/mod\.rs:\d+:\d+: (replace session_bus -> Option<zbus::Connection> with None|delete ! in system_services)$',
    # netvfs-bridge core/admin.rs insecure_answered: reached only through
    # insecure-consent, i.e. a webdav, ftp or smb ad-hoc URL with an
    # installed backend for it; test-backends has only the fake one
    # (netvfs 0.4's tst_bridgeserver skipped this as well).
    # needs_insecure_consent and insecure_details are unit-tested.
    'netvfs-bridge/src/core/admin\.rs:\d+:\d+: (replace Core::insecure_answered with \(\)|delete ! in Core::insecure_answered)$',
]
