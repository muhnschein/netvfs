[package]
name = "netvfs-accounts"
description = "The setgid accounts helper of netvfs-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "netvfs_accounts"
path = "src/lib.rs"

[[bin]]
name = "netvfs-accounts"
path = "src/main.rs"

[[bin]]
name = "netvfs-accounts-probe"
path = "src/bin/probe.rs"
required-features = ["probe"]

[features]
probe = []

[dependencies]
libc = "0.2"
rusqlite = { version = "0.43", default-features = false }
