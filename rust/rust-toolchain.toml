# The compiler the Sailfish OS SDK will ship (rust-version in Cargo.toml):
# builds, lints and tests use it, so CI checks what the target compiles.
# scheduled.yml runs the current stable's clippy as well.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
profile = "minimal"
