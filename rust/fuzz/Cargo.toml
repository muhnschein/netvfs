# SPDX-License-Identifier: LGPL-2.1-or-later
# cargo-fuzz targets (doc/RUST.md): the inputs of netvfs-accounts (stored
# setting values from the accounts database, the session bus's replies, its
# arguments) and netvfs-bridge's FFI marshalling.
# Not part of the workspace: libFuzzer needs a nightly toolchain, the helper
# builds with the SDK's 1.75. Run: cargo +nightly fuzz run <target>.
[package]
name = "netvfs-accounts-fuzz"
version = "0.0.0"
edition = "2024"
license = "LGPL-2.1-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
netvfs-accounts = { path = "../netvfs-accounts" }
netvfs-bridge = { path = "../netvfs-bridge", features = ["testing"] }
netvfs-bridge-proto = { path = "../netvfs-bridge-proto" }

[workspace]

[[bin]]
name = "stored_value"
path = "fuzz_targets/stored_value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bus_reply"
path = "fuzz_targets/bus_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arguments"
path = "fuzz_targets/arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_marshal"
path = "fuzz_targets/ffi_marshal.rs"
test = false
doc = false
bench = false
