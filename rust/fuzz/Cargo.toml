# SPDX-License-Identifier: LGPL-2.1-or-later
# cargo-fuzz targets for untrusted inputs (doc/RUST.md): of netvfs-accounts,
# stored setting values from the accounts database, the session bus's replies
# and its arguments; of netvfs-bridge, a consumer's call arguments and byte
# paths, the FFI marshalling, and UDisks2's description of the drives; of netvfs-sftp, an SFTP server's packets
# and attribute blocks, and key files; of netvfs-smb, what an SMB server sends
# (responses, TRANSFORM_HEADER frames, the NTLM challenge, SPNEGO, the srvsvc
# share list).
# Not part of the workspace: libFuzzer needs a nightly toolchain, the helper
# builds with the SDK's 1.75. Run: cargo +nightly fuzz run <target>.
[package]
name = "netvfs-accounts-fuzz"
version = "0.0.0"
edition = "2024"
license = "LGPL-2.1-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
netvfs-accounts = { path = "../netvfs-accounts" }
netvfs-bridge = { path = "../netvfs-bridge", features = ["testing"] }
netvfs-bridge-proto = { path = "../netvfs-bridge-proto" }
netvfs-smb = { path = "../netvfs-smb" }
zeroize = "1"
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
netvfs-sftp = { path = "../netvfs-sftp" }
netvfs-vfs = { path = "../netvfs-vfs" }
arbitrary = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "time"] }

[workspace]

# As in ../Cargo.toml: ssh-key with the change of ../vendor/ssh-key.
[patch.crates-io]
ssh-key = { path = "../vendor/ssh-key" }

[[bin]]
name = "stored_value"
path = "fuzz_targets/stored_value.rs"
test = false
doc = false
bench = false

