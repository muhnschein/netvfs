# SPDX-License-Identifier: LGPL-2.1-or-later
# cargo-fuzz targets for untrusted inputs. Outside the workspace: libFuzzer needs nightly, helper builds with SDK 1.75.
# Run: cargo +nightly fuzz run <target>.
[package]
name = "netvfs-accounts-fuzz"
version = "0.0.0"
edition = "2024"
license = "LGPL-2.1-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
netvfs-accounts = { path = "../netvfs-accounts" }
netvfs-bridge = { path = "../netvfs-bridge", features = ["testing"] }
netvfs-bridge-proto = { path = "../netvfs-bridge-proto" }
netvfs-smb = { path = "../netvfs-smb" }
zeroize = "1"
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
netvfs-sftp = { path = "../netvfs-sftp" }
netvfs-vfs = { path = "../netvfs-vfs" }
arbitrary = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "time"] }

[workspace]

# As in ../Cargo.toml: patched ssh-key and picky-asn1-der.
[patch.crates-io]
ssh-key = { path = "../vendor/ssh-key" }
picky-asn1-der = { path = "../vendor/picky-asn1-der" }

[[bin]]
name = "stored_value"
path = "fuzz_targets/stored_value.rs"
test = false
doc = false
bench = false

