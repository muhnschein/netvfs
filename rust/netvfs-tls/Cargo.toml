[package]
name = "netvfs-tls"
description = "TLS 1.3 client side of the WebDAV and FTPS backends: rustls with ring, system trust, SPKI pins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
netvfs-vfs = { path = "../netvfs-vfs" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
ring = "0.17"
data-encoding = "2"
tokio = { version = "1", default-features = false, features = ["net", "time"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }
