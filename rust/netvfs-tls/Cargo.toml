[package]
name = "netvfs-tls"
description = "TLS 1.3 client side of the WebDAV backend: rustls with ring, system trust, SPKI pins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
netvfs-vfs = { path = "../netvfs-vfs" }
# TLS 1.3 only; ring provider (in tree via russh), no aws-lc-rs, no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Leaf certificate parsing for its SubjectPublicKeyInfo; rustls's own verifier crate.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
# The system CA store (SFOS: ca-certificates bundle).
rustls-native-certs = "0.8"
ring = "0.17"
# Pins: `tls-spki-sha256 <base64>` (in tree via netvfs-sftp).
data-encoding = "2"
tokio = { version = "1", default-features = false, features = ["net", "time"] }

[dev-dependencies]
# Test servers: TLS 1.2 to prove it is refused.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }
