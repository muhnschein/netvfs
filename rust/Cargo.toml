# SPDX-License-Identifier: LGPL-2.1-or-later
[workspace]
resolver = "3"
members = ["netvfs-accounts", "netvfs-bridge-proto", "netvfs-bridge", "netvfs-vfs", "netvfs-sftp", "netvfs-smb", "netvfs-tls", "netvfs-webdav", "netvfs-ftps", "netvfs-backend"]
exclude = ["fuzz", "vendor"]

[patch.crates-io]
ssh-key = { path = "vendor/ssh-key" }
picky-asn1-der = { path = "vendor/picky-asn1-der" }

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-2.1-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(netvfs_asan)"] }
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
redundant_clone = "deny"
needless_collect = "deny"
or_fun_call = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
equatable_if_let = "deny"
option_if_let_else = "allow"
debug_assert_with_mut_call = "deny"
iter_on_single_items = "deny"
path_buf_push_overwrite = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_ref_ptr = "deny"
mem_forget = "deny"
exit = "deny"
get_unwrap = "deny"
lossy_float_literal = "deny"
rest_pat_in_fully_bound_structs = "deny"
str_to_string = "deny"
try_err = "deny"
verbose_file_reads = "deny"
let_underscore_must_use = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
empty_drop = "deny"
mutex_atomic = "deny"
infinite_loop = "deny"
if_then_some_else_none = "deny"
large_include_file = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
debug = false
strip = "symbols"

[profile.rs-release]
inherits = "release"
panic = "unwind"
lto = "fat"

[profile.rs-test]
inherits = "dev"
panic = "unwind"

[profile.dev]
panic = "abort"
debug = "line-tables-only"
incremental = false
