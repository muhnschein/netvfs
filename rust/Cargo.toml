# SPDX-License-Identifier: LGPL-2.1-or-later
# The Rust parts of netvfs: netvfs-accounts, the setgid accounts helper
# (SPEC-v2 XB-2a), netvfs-bridge-proto, the org.netvfs.Bridge1 protocol
# crate, netvfs-bridge, netvfs-vfs, the Rust side of the backend interface,
# and netvfs-backend, libnetvfs-rs.so (the Rust backends behind the C++
# plugins). See doc/RUST.md.
[workspace]
resolver = "3"
members = ["netvfs-accounts", "netvfs-bridge-proto", "netvfs-bridge", "netvfs-vfs", "netvfs-sftp", "netvfs-smb", "netvfs-backend"]
# The fuzz targets build with a nightly toolchain of their own (doc/RUST.md).
# vendor/ holds crates.io crates netvfs builds with a change of its own
# ([patch.crates-io] below); they are not netvfs's code.
exclude = ["fuzz", "vendor"]

# vendor/ssh-key/README.netvfs.md: ssh-key 0.7.0-rc.11 (russh's key format
# crate), with ECDSA private scalars shorter than the field size accepted.
[patch.crates-io]
ssh-key = { path = "vendor/ssh-key" }

[workspace.package]
version = "0.5.0"
edition = "2024"
# The rustc that sailfishos/rust ships next (JB#64166). Until an SDK target
# has it, CI cross-builds with host cargo against the SDK's compiler and
# sysroot (tools/ci/cross-build.sh, doc/RUST.md).
rust-version = "1.95"
license = "LGPL-2.1-or-later"
publish = false

# The lint regime (doc/RUST.md "Lints"): clippy `all` and `pedantic` at deny,
# a picked nursery/restriction set, and for shipped code the restriction
# lints that rule out panics and silent overflow. Tests opt out of the last
# group where it only adds noise (clippy.toml, `allow` on test modules).
[workspace.lints.rust]
# Allowed only in the modules that talk to C (`ffi`, `sys`, the helper's
# `sandbox`), each with `#![allow(unsafe_code)]` and SAFETY comments.
unsafe_code = "deny"
# Set by tools/ci/rust-sanitize.sh only.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(netvfs_asan)"] }
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
# nursery
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
redundant_clone = "deny"
needless_collect = "deny"
or_fun_call = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
equatable_if_let = "deny"
option_if_let_else = "allow"
debug_assert_with_mut_call = "deny"
iter_on_single_items = "deny"
path_buf_push_overwrite = "deny"
# restriction: no panics, no silent overflow, no stray output
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_ref_ptr = "deny"
mem_forget = "deny"
exit = "deny"
get_unwrap = "deny"
lossy_float_literal = "deny"
rest_pat_in_fully_bound_structs = "deny"
str_to_string = "deny"
try_err = "deny"
verbose_file_reads = "deny"
let_underscore_must_use = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
empty_drop = "deny"
mutex_atomic = "deny"
infinite_loop = "deny"
if_then_some_else_none = "deny"
large_include_file = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
debug = false
strip = "symbols"

# libnetvfs-rs.so (netvfs-backend): a panic must unwind to the table
# function that catches it and reports Internal (design §1.4), while the
# binaries keep aborting. Cargo sets `panic` per profile, not per package,
# so the library has profiles of its own: `cargo build --profile rs-release
# -p netvfs-backend` for the package, `rs-test` (with `--features testing`)
# for the C++ tests that load it.
[profile.rs-release]
inherits = "release"
panic = "unwind"
lto = "fat"

[profile.rs-test]
inherits = "dev"
panic = "unwind"

# Tests start the helper many times; a fast build matters more than size.
[profile.dev]
panic = "abort"
debug = "line-tables-only"
incremental = false
