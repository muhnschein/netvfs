# SPDX-License-Identifier: LGPL-2.1-or-later
# Rust parts: netvfs-accounts (setgid accounts helper), netvfs-bridge-proto (org.netvfs.Bridge1), netvfs-bridge, netvfs-vfs (backend interface), netvfs-sftp, netvfs-smb, netvfs-backend (libnetvfs-rs.so: Rust backends behind the C++ plugins).
[workspace]
resolver = "3"
members = ["netvfs-accounts", "netvfs-bridge-proto", "netvfs-bridge", "netvfs-vfs", "netvfs-sftp", "netvfs-smb", "netvfs-backend"]
# Fuzz targets build with their own nightly toolchain. vendor/: patched crates.io crates ([patch.crates-io] below).
exclude = ["fuzz", "vendor"]

# vendor/ssh-key: ssh-key 0.7.0-rc.11 accepting ECDSA private scalars shorter than the field size. vendor/picky-asn1-der: picky-asn1-der 0.5.7 with a DER length near usize::MAX an error, not an overflow.
[patch.crates-io]
ssh-key = { path = "vendor/ssh-key" }
picky-asn1-der = { path = "vendor/picky-asn1-der" }

[workspace.package]
version = "0.6.0"
edition = "2024"
# rustc that sailfishos/rust ships next (JB#64166). Until an SDK target has it, CI cross-builds with host cargo against the SDK compiler and sysroot (tools/ci/cross-build.sh).
rust-version = "1.95"
license = "LGPL-2.1-or-later"
publish = false

# Lints: clippy `all` and `pedantic` deny, picked nursery/restriction set, panic/overflow restriction lints for shipped code. Tests opt out of the last group (clippy.toml, `allow` on test modules).
[workspace.lints.rust]
# Only in modules talking to C (`ffi`, `sys`, helper's `sandbox`), each `#![allow(unsafe_code)]` with SAFETY comments.
unsafe_code = "deny"
# Set by tools/ci/rust-sanitize.sh only.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(netvfs_asan)"] }
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
# nursery
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
redundant_clone = "deny"
needless_collect = "deny"
or_fun_call = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
equatable_if_let = "deny"
option_if_let_else = "allow"
debug_assert_with_mut_call = "deny"
iter_on_single_items = "deny"
path_buf_push_overwrite = "deny"
# restriction: no panics, no silent overflow, no stray output
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_ref_ptr = "deny"
mem_forget = "deny"
exit = "deny"
get_unwrap = "deny"
lossy_float_literal = "deny"
rest_pat_in_fully_bound_structs = "deny"
str_to_string = "deny"
try_err = "deny"
verbose_file_reads = "deny"
let_underscore_must_use = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
empty_drop = "deny"
mutex_atomic = "deny"
infinite_loop = "deny"
if_then_some_else_none = "deny"
large_include_file = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
debug = false
strip = "symbols"

# libnetvfs-rs.so: a panic must unwind to the table function that catches it and reports Internal; binaries keep aborting. Cargo sets `panic` per profile, so the library has own profiles: `--profile rs-release -p netvfs-backend`, `rs-test` (`--features testing`) for C++ tests.
[profile.rs-release]
inherits = "release"
panic = "unwind"
lto = "fat"

[profile.rs-test]
inherits = "dev"
panic = "unwind"

# Tests start the helper often: fast build over size.
[profile.dev]
panic = "abort"
debug = "line-tables-only"
incremental = false
