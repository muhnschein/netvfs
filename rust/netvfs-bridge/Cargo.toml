[package]
name = "netvfs-bridge"
description = "netvfs-bridge: org.netvfs.Bridge1 for sandboxed consumers, over the C++ backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fake control table, fixtures, private dbus-daemon for session-bus tests.
testing = []
# Fake accounts helper `netvfs-accounts-fake`.
test-bins = []

[dependencies]
netvfs-vfs = { path = "../netvfs-vfs" }
netvfs-bridge-proto = { path = "../netvfs-bridge-proto" }
libc = "0.2"
zeroize = "1"
# p2p server with fd passing; `bus-impl` for `Builder::build_message_stream`. Also the session-bus client.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p", "bus-impl"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "signal", "macros"] }
futures-lite = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
netvfs-bridge-proto = { path = "../netvfs-bridge-proto", features = ["fake"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "io-util", "test-util"] }

# C ABI against the real libnetvfs-bridge-ffi.so and fake backend. Own main(): `init` runs on the main thread. Skipped without the NETVFS_BRIDGE_FFI* variables.
[[test]]
name = "ffi"
path = "tests/ffi.rs"
harness = false
required-features = ["testing"]

[[test]]
name = "backend"
path = "tests/backend.rs"
harness = false
required-features = ["testing"]

# Bridge end to end, in-process.
[[test]]
name = "server"
path = "tests/server.rs"
harness = false
required-features = ["testing"]

# `netvfs-bridge [--listen ADDRESS] <consumer-id>`
[[bin]]
name = "netvfs-bridge"
path = "src/main.rs"

[[bin]]
name = "netvfs-accounts-fake"
path = "src/bin/accounts_fake.rs"
required-features = ["test-bins"]
test = false

[[test]]
name = "process"
required-features = ["testing", "test-bins"]

[[test]]
name = "contract"
required-features = ["testing", "test-bins"]

[[test]]
name = "notifications"
required-features = ["testing"]

[[test]]
name = "accounts"
required-features = ["testing", "test-bins"]
