# cargo nextest (make check-rust). CI runs the "ci" profile: no retries, so
# a flaky test fails the build instead of hiding.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }
