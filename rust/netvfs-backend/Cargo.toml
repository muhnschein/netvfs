[package]
name = "netvfs-backend"
description = "libnetvfs-rs.so: the Rust backends behind the C++ backend plugins (src/backends/rs/netvfs_rs.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "netvfs_rs"
crate-type = ["cdylib", "rlib"]

[features]
testing = ["dep:sha2"]

[dependencies]
netvfs-vfs = { path = "../netvfs-vfs" }
netvfs-sftp = { path = "../netvfs-sftp" }
netvfs-smb = { path = "../netvfs-smb" }
netvfs-webdav = { path = "../netvfs-webdav" }
netvfs-ftps = { path = "../netvfs-ftps" }
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
zeroize = "1"
sha2 = { version = "0.11", optional = true }

[[test]]
name = "ffi"
required-features = ["testing"]
