[package]
name = "netvfs-ftps"
description = "An FTPS client (explicit TLS 1.3, MLSD, EPSV): the ftps provider of libnetvfs-rs.so"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
netvfs-vfs = { path = "../netvfs-vfs" }
netvfs-tls = { path = "../netvfs-tls" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
data-encoding = "2"
