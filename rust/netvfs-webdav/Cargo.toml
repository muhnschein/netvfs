[package]
name = "netvfs-webdav"
description = "A WebDAV client over HTTPS (TLS 1.3): the webdav provider of libnetvfs-rs.so"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
netvfs-vfs = { path = "../netvfs-vfs" }
netvfs-tls = { path = "../netvfs-tls" }
# HTTP/1.1 client connection; requests, bodies, dates.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
http = "1"
http-body = "1"
# TokioIo: tokio streams as hyper I/O.
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
httpdate = "1"
# PROPFIND multistatus.
quick-xml = "0.42"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
zeroize = "1"
# Basic credentials (in tree via netvfs-sftp).
data-encoding = "2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# The fake server (src/fake.rs).
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
