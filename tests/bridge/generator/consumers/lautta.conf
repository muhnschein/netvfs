# netvfs-bridge consumer registration (SPEC-v2 XB-3). The systemd user
# generator turns it into netvfs-bridge@lautta.{socket,service,path}.
[Consumer]
Id=lautta
DisplayName=Lautta
Executable=/usr/bin/harbour-lautta
DataDir=.local/share/org.netvfs/lautta
