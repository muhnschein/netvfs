# Explicit FTPS only, TLS 1.3 only, protected data, data sessions must resume the control session (default).
ServerName "netvfs interop"
ServerType standalone
DefaultServer on
Port 2121
UseIPv6 off
User proftpd
Group nogroup
Umask 022
DefaultRoot ~
RequireValidShell off
AuthOrder mod_auth_file.c
AuthUserFile /etc/proftpd/ftpd.passwd
PassivePorts %{env:PASV_FIRST} %{env:PASV_LAST}
ModulePath /usr/lib/proftpd
LoadModule mod_tls.c
TLSEngine on
TLSRequired on
TLSProtocol TLSv1.3
TLSECCertificateFile /etc/netvfs/self.crt
TLSECCertificateKeyFile /etc/netvfs/self.key
TLSVerifyClient off
# TLS 1.3 resumes by ticket only.
TLSSessionTickets on
TLSLog /dev/stderr
<Directory ~>
  AllowOverwrite on
</Directory>
