# M-T1: the strict server of SPEC-smb section 7, plus settings that only
# silence printing and NetBIOS in a container.
[global]
  server role = standalone server
  server min protocol = SMB3_11
  server signing = mandatory
  server smb encrypt = required
  ntlm auth = ntlmv2-only
  map to guest = never
  # XM-4: Samba sets the hidden attribute on dot names by default; the
  # conformance suite checks that the backend does not (it reports the
  # attribute as the server has it).
  hide dot files = no
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
