[global]
  server role = standalone server
  server min protocol = SMB3_11
  server signing = mandatory
  server smb encrypt = required
  ntlm auth = ntlmv2-only
  map to guest = never
  hide dot files = no
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
