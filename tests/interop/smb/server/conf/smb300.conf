# SMB 3.0 at most; the client offers SMB 3.1.1 only, so every profile is refused.
[global]
  server role = standalone server
  server min protocol = SMB2_02
  server max protocol = SMB3_00
  server signing = mandatory
  server smb encrypt = required
  ntlm auth = ntlmv2-only
  map to guest = never
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
