[global]
  server role = standalone server
  server min protocol = SMB2_02
  map to guest = Bad User
  guest account = nobody
  restrict anonymous = 0
  ntlm auth = ntlmv2-only
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
[public]
  path = /srv/smb/public
  guest ok = yes
  read only = no
  force user = nobody
  create mask = 0666
  directory mask = 0777
