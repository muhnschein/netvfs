# M-T3, M-T4, M-T12: encryption switched off, signing as the client asks.
[global]
  server role = standalone server
  server smb encrypt = off
  ntlm auth = ntlmv2-only
  map to guest = never
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
