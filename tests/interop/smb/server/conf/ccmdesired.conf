# M-T14: encryption desired, AES-CCM ciphers only. Samba still marks the
# session for encryption although no cipher was negotiated; the client
# refuses that session (it fails closed) whatever the profile.
[global]
  server role = standalone server
  server min protocol = SMB3_11
  server signing = mandatory
  server smb encrypt = desired
  server smb3 encryption algorithms = AES-128-CCM, AES-256-CCM
  ntlm auth = ntlmv2-only
  map to guest = never
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
