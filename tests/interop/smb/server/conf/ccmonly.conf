# Encryption required, AES-CCM ciphers only: no cipher in common with the client (AES-GCM only), so it is refused.
[global]
  server role = standalone server
  server min protocol = SMB3_11
  server signing = mandatory
  server smb encrypt = required
  server smb3 encryption algorithms = AES-128-CCM, AES-256-CCM
  ntlm auth = ntlmv2-only
  map to guest = never
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
