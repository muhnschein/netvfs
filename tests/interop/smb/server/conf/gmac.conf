# M-T14: signing only with an algorithm libsmb2 does not implement.
[global]
  server role = standalone server
  server min protocol = SMB3_11
  server signing = mandatory
  server smb encrypt = off
  server smb3 signing algorithms = AES-128-GMAC, HMAC-SHA256
  ntlm auth = ntlmv2-only
  map to guest = never
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
