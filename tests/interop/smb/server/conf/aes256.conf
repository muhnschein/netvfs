# M-T14: encryption required, AES-256-GCM the only cipher (the client offers
# AES-128-GCM first): must pass.
[global]
  server role = standalone server
  server min protocol = SMB3_11
  server signing = mandatory
  server smb encrypt = required
  server smb3 encryption algorithms = AES-256-GCM
  ntlm auth = ntlmv2-only
  map to guest = never
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
