# M-T9: SMB 2.x only.
[global]
  server role = standalone server
  server min protocol = SMB2_02
  server max protocol = SMB2_10
  server signing = mandatory
  ntlm auth = ntlmv2-only
  map to guest = never
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  disable netbios = yes
  smb ports = 445
