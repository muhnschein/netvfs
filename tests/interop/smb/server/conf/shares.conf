# Shares appended to every variant. "small" is a tmpfs when run.sh mounts one.
[backup]
  path = /srv/smb/backup
  valid users = backup
  read only = no
[readonly]
  path = /srv/smb/readonly
  valid users = backup
  read only = yes
[small]
  path = /srv/smb/small
  valid users = backup
  read only = no
# More disk shares for server mode (five, so the limit of four contexts is reached), an administrative share, and a DFS root with a link to another server.
[media]
  path = /srv/smb/media
  valid users = backup
  read only = no
  comment = Films and music
[hidden$]
  path = /srv/smb/hidden
  valid users = backup
  read only = no
[dfs]
  path = /srv/smb/dfs
  valid users = backup
  msdfs root = yes
