# Shares appended to every variant. "small" is a tmpfs when run.sh mounts one (M-T16).
[backup]
  path = /srv/smb/backup
  valid users = backup
  read only = no
[readonly]
  path = /srv/smb/readonly
  valid users = backup
  read only = yes
[small]
  path = /srv/smb/small
  valid users = backup
  read only = no
