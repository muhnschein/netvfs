# WebDAV interop server (SPEC-v2 XT-2):
#   :80    plain HTTP (allow_insecure)
#   :443   TLS, self-signed certificate (pin flows)
#   :8443  TLS, certificate from the run's test CA, HTTP/2 (system trust flow)
# Locations: /dav (Basic), /digest (Digest), /small (1 MiB tmpfs, 507),
# /moved -> /dav (same-origin redirect), /elsewhere -> another origin.
ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 80
Listen 443
Listen 8443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule auth_digest_module modules/mod_auth_digest.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so

User daemon
Group daemon
TypesConfig conf/mime.types
DavLockDB /usr/local/apache2/var/DavLock
KeepAliveTimeout 30
Timeout 30

# XT-5: whether a request carried credentials, never their value.
SetEnvIf Authorization "." NETVFS_AUTH=yes
LogFormat "%m %U %>s auth=%{NETVFS_AUTH}e" netvfs
CustomLog /proc/self/fd/1 netvfs
ErrorLog /proc/self/fd/2
LogLevel warn

<Directory />
    AllowOverride None
    Require all denied
</Directory>

Redirect 301 /moved /dav
Redirect 302 /elsewhere https://elsewhere.invalid/dav

Alias /dav /srv/dav
<Directory /srv/dav>
    Dav On
    AuthType Basic
    AuthName "netvfs"
    AuthBasicProvider file
    AuthUserFile conf/htpasswd
    Require valid-user
</Directory>

Alias /digest /srv/digest
<Directory /srv/digest>
    Dav On
    AuthType Digest
    AuthName "netvfs"
    AuthDigestProvider file
    AuthUserFile conf/htdigest
    Require valid-user
</Directory>

Alias /small /srv/small
<Directory /srv/small>
    Dav On
    AuthType Basic
    AuthName "netvfs"
    AuthBasicProvider file
    AuthUserFile conf/htpasswd
    Require valid-user
</Directory>

SSLSessionCache shmcb:/usr/local/apache2/var/ssl_scache(512000)

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/netvfs/self.crt
    SSLCertificateKeyFile /etc/netvfs/self.key
</VirtualHost>

<VirtualHost *:8443>
    Protocols h2 http/1.1
    SSLEngine on
    SSLCertificateFile /etc/netvfs/signed.crt
    SSLCertificateKeyFile /etc/netvfs/signed.key
</VirtualHost>
