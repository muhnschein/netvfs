sonar.projectKey=muhnschein_netvfs
sonar.organization=muhnschein


sonar.projectName=netvfs
sonar.projectVersion=0.6.0


sonar.sources=src,rust
sonar.tests=tests,rust
sonar.test.inclusions=tests/**,rust/*/tests/**
sonar.exclusions=rust/*/tests/**,rust/fuzz/**,rust/target/**,rust/vendor/**

sonar.sourceEncoding=UTF-8

# C/C++: compilation database from the coverage build.
sonar.cfamily.compile-commands=build-coverage/compile_commands.json
# gcov results via gcovr (make coverage).
sonar.coverageReportPaths=build-coverage/coverage.xml
# Rust: llvm-cov coverage (make coverage), clippy findings (make clippy-report).
sonar.rust.lcov.reportPaths=build-coverage/rust-lcov.info
sonar.rust.clippy.reportPaths=build-coverage/clippy.json

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Rules that cannot hold for the C ABI of libnetvfs-bridge-ffi.so: header src/bridge/ffi/netvfs_bridge_ffi.h is frozen. One rule per file where the ABI dictates the construct, never a directory.
sonar.issue.ignore.multicriteria=abiMacros,abiEnums,abiTable,\
    abiVoidConn,abiVoidOps,abiVoidFfi,abiFnConn,abiFnOps,abiFnFfi,\
    abiConstConn,abiConstIo,abiConstOps,abiMalloc,abiFree,abiCatchStd,abiCatchAll,\
    rsMacros,rsTable,rsVoidHooksH,rsVoidHooks,rsConstHooks,rsCatchAll

# C header: #define constants (S5028), plain enums (S3642), one table of function pointers (S1820).
sonar.issue.ignore.multicriteria.abiMacros.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.abiMacros.resourceKey=src/bridge/ffi/netvfs_bridge_ffi.h
sonar.issue.ignore.multicriteria.abiEnums.ruleKey=cpp:S3642
sonar.issue.ignore.multicriteria.abiEnums.resourceKey=src/bridge/ffi/netvfs_bridge_ffi.h
sonar.issue.ignore.multicriteria.abiTable.ruleKey=cpp:S1820
sonar.issue.ignore.multicriteria.abiTable.resourceKey=src/bridge/ffi/netvfs_bridge_ffi.h

# Table functions have their table field's type: callbacks are C function pointers with void * context (S5205, S5008), free takes void * (S5008). Wrapped into std::function at once.
sonar.issue.ignore.multicriteria.abiVoidConn.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.abiVoidConn.resourceKey=src/bridge/ffi/conn.cpp
sonar.issue.ignore.multicriteria.abiVoidOps.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.abiVoidOps.resourceKey=src/bridge/ffi/ops.cpp
sonar.issue.ignore.multicriteria.abiVoidFfi.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.abiVoidFfi.resourceKey=src/bridge/ffi/ffi.cpp
sonar.issue.ignore.multicriteria.abiFnConn.ruleKey=cpp:S5205
sonar.issue.ignore.multicriteria.abiFnConn.resourceKey=src/bridge/ffi/conn.cpp
sonar.issue.ignore.multicriteria.abiFnOps.ruleKey=cpp:S5205
sonar.issue.ignore.multicriteria.abiFnOps.resourceKey=src/bridge/ffi/ops.cpp
sonar.issue.ignore.multicriteria.abiFnFfi.ruleKey=cpp:S5205
sonar.issue.ignore.multicriteria.abiFnFfi.resourceKey=src/bridge/ffi/ffi.cpp

# Table function params nvb_conn * / nvb_handle * cannot be const (S995): function pointer types must match the table field.
sonar.issue.ignore.multicriteria.abiConstConn.ruleKey=cpp:S995
sonar.issue.ignore.multicriteria.abiConstConn.resourceKey=src/bridge/ffi/conn.cpp
sonar.issue.ignore.multicriteria.abiConstIo.ruleKey=cpp:S995
sonar.issue.ignore.multicriteria.abiConstIo.resourceKey=src/bridge/ffi/io.cpp
sonar.issue.ignore.multicriteria.abiConstOps.ruleKey=cpp:S995
sonar.issue.ignore.multicriteria.abiConstOps.resourceKey=src/bridge/ffi/ops.cpp

# Returned objects are ONE malloc'd block freed with free(), no destructors (S1231; pack() static_asserts it).
sonar.issue.ignore.multicriteria.abiMalloc.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.abiMalloc.resourceKey=src/bridge/ffi/marshal.h
sonar.issue.ignore.multicriteria.abiFree.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.abiFree.resourceKey=src/bridge/ffi/ffi.cpp

# No exception crosses the C boundary. internalResult() catches std::exception (S1181), then anything (S2738); both become Internal.
sonar.issue.ignore.multicriteria.abiCatchStd.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.abiCatchStd.resourceKey=src/bridge/ffi/ffi.cpp
sonar.issue.ignore.multicriteria.abiCatchAll.ruleKey=cpp:S2738
sonar.issue.ignore.multicriteria.abiCatchAll.resourceKey=src/bridge/ffi/ffi.cpp

# Same for the C ABI of libnetvfs-rs.so (src/backends/rs/netvfs_rs.h) and the C++ shim file handing C callbacks to it.
# C header: NVR_ENTRY is a #define (S5028), nvr_table (S1820) is one table.
sonar.issue.ignore.multicriteria.rsMacros.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.rsMacros.resourceKey=src/backends/rs/netvfs_rs.h
sonar.issue.ignore.multicriteria.rsTable.ruleKey=cpp:S1820
sonar.issue.ignore.multicriteria.rsTable.resourceKey=src/backends/rs/netvfs_rs.h

# Hooks trampolines match their callback field types: void * context (S5008), not const (S995). Each restores Hooks at once.
sonar.issue.ignore.multicriteria.rsVoidHooksH.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.rsVoidHooksH.resourceKey=src/backends/rs/rshooks.h
sonar.issue.ignore.multicriteria.rsVoidHooks.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.rsVoidHooks.resourceKey=src/backends/rs/rshooks.cpp
sonar.issue.ignore.multicriteria.rsConstHooks.ruleKey=cpp:S995
sonar.issue.ignore.multicriteria.rsConstHooks.resourceKey=src/backends/rs/rshooks.cpp

# Nothing a callback throws may cross into Rust. Hooks::guard() catches all (S2738); call becomes Internal.
sonar.issue.ignore.multicriteria.rsCatchAll.ruleKey=cpp:S2738
sonar.issue.ignore.multicriteria.rsCatchAll.resourceKey=src/backends/rs/rshooks.cpp
