sonar.projectKey=muhnschein_netvfs
sonar.organization=muhnschein


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=netvfs
sonar.projectVersion=0.3.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.tests=tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# C/C++: compilation database from the coverage build (see .github/workflows/build.yml).
sonar.cfamily.compile-commands=build-coverage/compile_commands.json
# gcov results converted by gcovr (make coverage).
sonar.coverageReportPaths=build-coverage/coverage.xml

# Fail the workflow when the quality gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
