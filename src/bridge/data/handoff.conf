# netvfs-bridge settings handoff, read by the bridge.
#
# UNVERIFIED: which jolla-settings D-Bus entry points open one account's page
# or the account creation flow of a provider on Sailfish OS 5.2 is an open
# question (doc/SPEC.md) that needs a device. What is used
# below is the publicly known jolla-settings service (com.jolla.settings,
# /com/jolla/settings/ui, interface com.jolla.settings.ui) and its
# showAccounts() call, which opens Settings -> Accounts (not one account, not
# the creation flow of one provider). Replace the entries once verified;
# nothing else needs to change.
#
# OpenStorageSettings opens Settings -> Storage: the showPage(path) call of
# jolla-settings with the entry path of the Storage page, as
# /usr/share/jolla-settings/settings.qml and entries/storage.json of
# Sailfish OS 5.2 have them (read from the 5.2.0.15 SDK target; not yet
# tried on a device).
#
# Arguments: ','-separated typed values "s:text", "i:42", "u:42", "b:true";
# placeholders {accountId} and {provider}.

[OpenAccountSettings]
Service=com.jolla.settings
Path=/com/jolla/settings/ui
Interface=com.jolla.settings.ui
Method=showAccounts
Arguments=

[AddAccount]
Service=com.jolla.settings
Path=/com/jolla/settings/ui
Interface=com.jolla.settings.ui
Method=showAccounts
Arguments=

[OpenStorageSettings]
Service=com.jolla.settings
Path=/com/jolla/settings/ui
Interface=com.jolla.settings.ui
Method=showPage
Arguments=s:system_settings/system/storage
