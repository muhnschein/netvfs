# netvfs-bridge settings handoff, read by the bridge.
#
# OpenAccountSettings: showAccounts() of jolla-settings (com.jolla.settings,
# /com/jolla/settings/ui, com.jolla.settings.ui) opens Settings -> Accounts,
# not one account's page: no entry point for that found.
#
# AddAccount: showPage(path) opens the Settings entry netvfs-add.json installs
# for {provider}: its page starts that provider's creation flow past the
# Accounts list. Unknown provider: no such entry, Settings opens nothing.
#
# OpenStorageSettings opens Settings -> Storage: the showPage(path) call of
# jolla-settings with the entry path of the Storage page, as
# /usr/share/jolla-settings/settings.qml and entries/storage.json of
# Sailfish OS 5.2 have them (read from the 5.2.0.15 SDK target; not yet
# tried on a device).
#
# OpenAccessRequest (tapped request notification) opens the Settings entry
# netvfs-access.json installs, with the same showPage call. Entry is a child
# of the Accounts tab, whose view lists accounts, not entries: Settings shows
# no row for it.
#
# Arguments: ','-separated typed values "s:text", "i:42", "u:42", "b:true";
# placeholders {accountId} and {provider}.

[OpenAccountSettings]
Service=com.jolla.settings
Path=/com/jolla/settings/ui
Interface=com.jolla.settings.ui
Method=showAccounts
Arguments=

[AddAccount]
Service=com.jolla.settings
Path=/com/jolla/settings/ui
Interface=com.jolla.settings.ui
Method=showPage
Arguments=s:accounts/netvfs_add_{provider}

[OpenStorageSettings]
Service=com.jolla.settings
Path=/com/jolla/settings/ui
Interface=com.jolla.settings.ui
Method=showPage
Arguments=s:system_settings/system/storage

[OpenAccessRequest]
Service=com.jolla.settings
Path=/com/jolla/settings/ui
Interface=com.jolla.settings.ui
Method=showPage
Arguments=s:accounts/netvfs_access
